# Container defaults for the Docker image (docker/compose.yml and
# docker/compose.release.yml). docker/Dockerfile copies this to
# config/config.toml in the image, the path `serve` and every other server
# command read by default.

[paths]
db = "data/messagecrate.db"
data_dir = "data"
assets_dir = "assets"
assets_converted_dir = "assets_converted"

# Bind all interfaces inside the container so Docker port publishing works.
# Which computers reach the server is set where the port is published: the
# `docker run` command in Start a Message Crate and both Compose files
# publish it on the host's 127.0.0.1 alone. Publishing it on the network is a separate step,
# described in Run on another machine; the server speaks plain HTTP, so keep
# it to a trusted network and do not port-forward it on the router.
#
# Port 8080 is also written into docker/Dockerfile (EXPOSE) and into the
# port mappings of docker/compose.yml and docker/compose.release.yml. A
# change to the port here must be made there too, or Docker publishes a port
# nothing answers on. The health check follows the port the server binds.
[server]
bind = "0.0.0.0:8080"

# No `cors_origins`: the server allows the packaged desktop app's origins
# whatever this file says, and the website it serves is same-origin, so
# neither needs an entry. The Vite development origins are left out on
# purpose, because they would let any page on port 5173 of the viewer's
# computer call this API. The developer Docker page, "Point cargo tauri dev
# at the container", gives the command that adds one for development
# (docs/src/content/docs/docs/developer/docker.md).
