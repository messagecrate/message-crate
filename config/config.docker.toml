# Container defaults for the Docker image (docker/compose.yml and
# docker/compose.release.yml). The entrypoint copies this to
# config/config.toml on every start, before `serve` or any other command.

[paths]
db = "data/messagecrate.db"
data_dir = "data"
assets_dir = "assets"
assets_converted_dir = "assets_converted"

# Bind all interfaces so Docker port publishing works.
# Compose publishes port 8080 on every interface of the host, so other
# machines on the network can reach it. Restrict that with the host firewall
# to a trusted subnet, and do not port-forward it on the router: the server
# speaks plain HTTP.
#
# Port 8080 is also written into docker/Dockerfile (EXPOSE and the
# HEALTHCHECK probe) and into the port mappings of docker/compose.yml and
# docker/compose.release.yml. A change to the port here must be made there
# too, or the container reads unhealthy while the server answers.
[server]
bind = "0.0.0.0:8080"

# No `cors_origins`: the server allows the packaged desktop app's origins
# whatever this file says, and the website it serves is same-origin, so
# neither needs an entry. The Vite development origins are left out on
# purpose, because they would let any page on port 5173 of the viewer's
# computer call this API. The developer Docker page, "Point cargo tauri dev
# at the container", gives the command that adds one for development
# (docs/src/content/docs/docs/developer/docker.md).
