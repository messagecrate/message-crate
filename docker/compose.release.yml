# Release — production-shaped image built from this checkout.
# No live editing; rebuild after code changes. Closer to what you ship.
#
# From the repository root:
#   docker compose -f docker/compose.release.yml up --build
#
# docker/Dockerfile builds the Vite SPA in its own stage — no host build needed.
#
# Staging drop: copy JSONL into ./staging (mounted at /app/staging).
#
# The container runs as user 1000, group 1000, the user the image is built
# for. A host account with another id sets UID and GID in .env (see
# .env.example) or exports them before starting, so the container can read
# the files dropped in ./staging:
#   export UID GID="$(id -g)"
#
# VPS Hub + nginx TLS: private message-crate-ops repo (compose-hub.yml).

name: message-crate

services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # The commit this image reports after the "+" in its version:
        #   BUILD_METADATA=$(git rev-parse --short=8 HEAD) docker compose ... up --build
        BUILD_METADATA: ${BUILD_METADATA:-unknown}
    ports:
      - "0.0.0.0:8080:8080"
    user: "${UID:-1000}:${GID:-1000}"
    # The server needs no Linux capability and writes only under /app/data.
    # Dropping every capability, refusing a privilege gain through setuid
    # files, and a read-only root filesystem limit what a process that gets
    # into the container can do. /tmp stays writable for temporary files.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - message-crate-data:/app/data
      - ../staging:/app/staging

volumes:
  message-crate-data:
