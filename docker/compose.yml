# Published Message Crate image. Save this file and run: docker compose up -d
# Docs: https://messagecrate.app/docs/user/features/owner/run-with-docker/
#
# Pin a release: change :latest to a release number such as :0.10.0 (no "v").
# JSONL drop: copy files into ./staging
#
# The container runs as user 1000, group 1000, the user the image is built
# for. A host account with another id exports its own before starting, so the
# container can read the files dropped in ./staging:
#   export UID GID="$(id -g)"

name: message-crate

services:
  server:
    image: bitrealm/message-crate:latest
    user: "${UID:-1000}:${GID:-1000}"
    # The server needs no Linux capability and writes only under /app/data.
    # Dropping every capability, refusing a privilege gain through setuid
    # files, and a read-only root filesystem limit what a process that gets
    # into the container can do. /tmp stays writable for temporary files.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    ports:
      # This computer only. To reach the server from other computers, see
      # https://messagecrate.app/docs/user/features/owner/run-on-another-machine/
      - "127.0.0.1:8080:8080"
    volumes:
      - message-crate-data:/app/data
      - ./staging:/app/staging
    restart: unless-stopped
    # A stopping server waits for the requests in flight, such as an import
    # batch, up to STOP_DRAIN_LIMIT in crates/server/server/src/server.rs.
    # Docker's own 10 seconds would kill it part-way, so it gets 10 seconds
    # more than that limit.
    stop_grace_period: 40s

volumes:
  message-crate-data:
    name: message-crate-data
