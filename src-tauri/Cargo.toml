[package]
name = "message-crate-desktop"
version = "0.10.1"
edition = "2024"
license = "LicenseRef-FCL-1.0-ALv2"
description = "Tauri desktop app for message-crate"

[lib]
name = "message_crate_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }
build-version = { path = "../crates/libs/build-version" }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0"
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
dirs = "7"
open = "5"
message-crate-core = { path = "../crates/core/message-crate-core" }
message-crate-log-lines = { path = "../crates/libs/log-lines" }
message-ir-format = { path = "../crates/libs/ir-format" }
message-staging = { path = "../crates/libs/staging" }
media = { path = "../crates/libs/media" }
message-ir = { path = "../crates/libs/ir" }
file-io = { path = "../crates/libs/file-io" }
sms-backup-restore-exporter = { path = "../crates/exporters/sms-backup-restore-exporter", default-features = false }
go-sms-pro-exporter = { path = "../crates/exporters/go-sms-pro-exporter", default-features = false }
sms-backup-plus-exporter = { path = "../crates/exporters/sms-backup-plus-exporter", default-features = false }
openextract-exporter = { path = "../crates/exporters/openextract-exporter", default-features = false }
imazing-exporter = { path = "../crates/exporters/imazing-exporter", default-features = false }
whatsapp-exporter = { path = "../crates/exporters/whatsapp-exporter", default-features = false }
imessage-ir-exporter = { path = "../crates/exporters/imessage-ir-exporter", default-features = false }
ios-backup = { path = "../crates/libs/ios-backup" }
message-reexport = { path = "../crates/libs/reexport" }
message-crate-import = { path = "../crates/libs/import" }
message-crate-export = { path = "../crates/libs/export" }
message-crate-http = { path = "../crates/libs/http" }
message-crate-serve-protocol = { path = "../crates/libs/serve-protocol" }
# The temporary file an attachment download is written to before it is
# renamed onto the file the person chose (`commands::download`).
tempfile = "3"

# The start-up download of ffmpeg, ffprobe and wtsexporter into the Tools
# Directory (`tool_downloads`): the HTTP client, the SHA-256 each file is
# checked against, and the gzip the ffmpeg-static files are published in.
reqwest = { version = "0.12.25", default-features = false, features = ["blocking", "rustls-tls", "rustls-tls-native-roots"] }
sha2 = "0.11.0"
hex = "0.4.3"
flate2 = "1.1.9"

# `killpg`, to kill the server the app started with every process the server
# started (`local_server::process_tree`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The Job Object the server the app started runs in, so its processes end
# with it (`local_server::process_tree`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
# `testutil` reads an Import Run log back as level and text pairs.
message-crate-core = { path = "../crates/core/message-crate-core", features = ["testutil"] }
# `testutil` builds the sample conversation the Export Directory tests write.
message-ir = { path = "../crates/libs/ir", features = ["testutil"] }
# `testutil` gives the lock a test holds while it names a Tools Directory.
media = { path = "../crates/libs/media", features = ["testutil"] }
httpmock = "0.8"
# Holds a test port with a socket that never listens (`local_server` tests).
# `all` gives `set_reuse_port`, which those tests need on Apple systems.
socket2 = { version = "0.6", features = ["all"] }

# Mirrors the workspace lints in the root Cargo.toml; this crate is outside
# the workspace and cannot inherit them.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
str_to_string = "allow"
redundant_pub_crate = "allow"

# Same release profile as the workspace root.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
