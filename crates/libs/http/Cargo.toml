[package]
name = "message-crate-http"
version = "0.1.0"
edition = "2024"
description = "Blocking HTTP client helpers and typed retry classification for the push and pull crates"
license = "LicenseRef-FCL-1.0-ALv2"

[dependencies]
anyhow = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
message-crate-api-types = { path = "../api-types" }

[dev-dependencies]
httpmock = "0.8"
rcgen = "0.14.10"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }

[lints]
workspace = true
