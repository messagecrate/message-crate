edition = "2024"
description = "Schema types for the common-message ConversationDocument intermediate representation"
license = "LicenseRef-FCL-1.0-ALv2"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
