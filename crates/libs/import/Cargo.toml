[package]
name = "message-crate-import"
version = "0.1.0"
edition = "2024"
description = "Import message-ir JSONL exports into a running Message Crate"
license = "LicenseRef-FCL-1.0-ALv2"

[dependencies]
anyhow = { workspace = true }
hex = { workspace = true }
jsonl_journal = { package = "journal", path = "../../libs/journal" }
message-crate-http = { path = "../../libs/http" }
message-crate-core = { path = "../../core/message-crate-core" }
media = { path = "../media" }
file-io = { workspace = true }
message-ir = { path = "../../libs/ir" }
message-ir-format = { path = "../../libs/ir-format" }
reqwest = { workspace = true, features = ["blocking"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
message-crate-api-types = { version = "0.1.0", path = "../api-types" }

[dev-dependencies]
# `testutil` reads an Import Run log back as level and text pairs.
message-crate-core = { path = "../../core/message-crate-core", features = ["testutil"] }
message-ir = { path = "../../libs/ir", features = ["testutil"] }
tempfile = { workspace = true }
httpmock = "0.8"

[lints]
workspace = true
