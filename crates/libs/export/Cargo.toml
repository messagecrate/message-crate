[package]
name = "export"
version = "0.1.0"
edition = "2024"
description = "Export messages from a Message Crate export API into a directory of JSONL conversation files"
license = "LicenseRef-FCL-1.0-ALv2"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
jsonl_journal = { package = "journal", path = "../../libs/journal" }
api-types = { path = "../../libs/api-types" }
message-crate-http = { path = "../../libs/http" }
message-crate-core = { path = "../../core/message-crate-core" }
media = { path = "../media" }
file-io = { workspace = true }
ir = { path = "../../libs/ir" }
ir-format = { path = "../../libs/ir-format" }
reqwest = { workspace = true, features = ["blocking"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
httpmock = "0.9"

[lints]
workspace = true
