[package]
name = "chat-db-fixture"
version = "0.1.0"
edition = "2024"
# Permissive on purpose, like the protocol crate: the GPL helper
# (`imessage-reader`) and the FCL exporter (`imessage-ir-exporter`) both use
# this crate in their tests. It links rusqlite, plist and the RustCrypto
# crates that encrypt the made-up iPhone backup, all permissive, so it carries
# no GPL code into the exporter's test binary.
# Why: docs/adr/0014-gpl-code-only-behind-a-process-boundary.md.
license = "MIT OR Apache-2.0"
description = "A small Apple Messages chat.db, and an iPhone backup holding it with or without encryption, for the tests of the imessage-reader helper and the crates that spawn it"
repository = "https://github.com/messagecrate/message-crate"
publish = false

# The crypto crates are required at the same 0.x minor versions crabapple
# 0.4.7 (pinned in `imessage-reader`) requires. Cargo resolves two
# requirements of one 0.x minor to one lockfile entry, so the fixture and
# crabapple always share each crate's version, and the backup is encrypted
# by the same primitives the reader decrypts it with. Caret ranges, not `=`
# pins, so a patch release can be taken for both at once. A crabapple bump
# that moves one of these to a new minor version must move it here too, or
# the lockfile holds two copies and the two sides drift apart.
[dependencies]
aes = "0.9.2"
aes-kw = "0.3.1"
cbc = "0.2.1"
pbkdf2 = { version = "0.13.0", features = ["hmac"] }
plist = "1.9.0"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
sha1 = "0.11.0"
sha2 = "0.11.0"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
