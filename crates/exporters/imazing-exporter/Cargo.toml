[package]
name = "imazing-exporter"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-FCL-1.0-ALv2"
description = "Convert iMazing Messages / WhatsApp CSV to the shared conversation structure"
autotests = false

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
hex = { workspace = true }
message-crate-csv = { path = "../../libs/csv" }
message-crate-core = { path = "../../core/message-crate-core" }
file-io = { workspace = true }
ir = { path = "../../libs/ir" }
ir-format = { path = "../../libs/ir-format" }
staging = { path = "../../libs/staging" }
phone = { path = "../../libs/phone" }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
message-crate-core = { path = "../../core/message-crate-core", features = ["testutil"] }
tempfile = { workspace = true }

[lints]
workspace = true
