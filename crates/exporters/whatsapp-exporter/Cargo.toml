[package]
name = "whatsapp-exporter"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-FCL-1.0-ALv2"
description = "Convert WhatsApp DB/backup via wtsexporter JSON to the shared conversation structure"
autotests = false

[dependencies]
anyhow = { workspace = true }
hex = { workspace = true }
# MIT OR Apache-2.0, so this FCL crate may link it; only the sentences an
# iPhone backup's password is refused with come from it.
imessage-reader-protocol = { path = "../../helpers/imessage-reader-protocol" }
ios-backup = { path = "../../libs/ios-backup" }
message-crate-csv = { path = "../../libs/csv" }
message-crate-core = { path = "../../core/message-crate-core" }
ir = { path = "../../libs/ir" }
ir-format = { path = "../../libs/ir-format" }
staging = { path = "../../libs/staging" }
media = { path = "../../libs/media" }
phone = { path = "../../libs/phone" }
plist = "1.9.0"
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
message-crate-core = { path = "../../core/message-crate-core", features = ["testutil"] }
ios-backup = { path = "../../libs/ios-backup", features = ["testutil"] }
media = { path = "../../libs/media", features = ["testutil"] }
tempfile = { workspace = true }
file-io = { workspace = true }

[lints]
workspace = true
