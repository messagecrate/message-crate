[package]
name = "sms-backup-restore-exporter"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-FCL-1.0-ALv2"
autotests = false

[features]
testutil = []

[dependencies]
anyhow = { workspace = true }
message-crate-core = { path = "../../core/message-crate-core" }
ir = { path = "../../libs/ir" }
ir-format = { path = "../../libs/ir-format" }
staging = { path = "../../libs/staging" }
message-crate-csv = { path = "../../libs/csv" }
phone = { path = "../../libs/phone" }
mms-parts = { path = "../../libs/mms-parts" }
sbr = { path = "../../libs/sbr" }
serde_json = { workspace = true }

[dev-dependencies]
ir = { path = "../../libs/ir", features = ["testutil"] }
message-crate-core = { path = "../../core/message-crate-core", features = ["testutil"] }
tempfile = { workspace = true }

[lints]
workspace = true
