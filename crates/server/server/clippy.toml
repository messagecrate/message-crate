# A deferred transaction that reads and then writes fails at its first write
# when another connection committed in between (SQLITE_BUSY_SNAPSHOT under
# WAL, which the busy timeout does not retry). Every transaction is a write
# transaction from crate::db::begin_write, which begins with BEGIN IMMEDIATE.
disallowed-methods = [
    { path = "sqlx::Connection::begin", reason = "a deferred transaction fails when another write lands between its read and its write; use crate::db::begin_write" },
    { path = "sqlx::Acquire::begin", reason = "a deferred transaction fails when another write lands between its read and its write; use crate::db::begin_write" },
    { path = "sqlx::Pool::begin", reason = "a deferred transaction fails when another write lands between its read and its write; use crate::db::begin_write" },
    # A test's client builds without root certificates, because reading the
    # system's certificate store costs about 23 ms a client.
    { path = "reqwest::Client::new", reason = "reads the system's certificate store, about 23 ms a client; use test_support::http_client" },
]
