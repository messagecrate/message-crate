[package]
name = "message-crate-core"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-FCL-1.0-ALv2"
description = "Shared export pipeline, jobs, and form model for the Message Crate desktop app"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
message-csv = { path = "../../libs/csv", optional = true }
message-crate-log-lines = { path = "../../libs/log-lines" }
message-ir = { path = "../../libs/ir" }
media = { path = "../../libs/media" }
obfuscate = { path = "../../libs/obfuscate" }
phone = { path = "../../libs/phone" }
serde_json = { workspace = true, optional = true }
serde = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }

[features]
# The CSV and JSON readers are only for `testutil`, which reads exports back
# in tests.
testutil = ["dep:message-csv", "dep:serde_json"]

[dev-dependencies]
message-csv = { path = "../../libs/csv" }
serde_json = { workspace = true }
media = { path = "../../libs/media", features = ["testutil"] }

[lints]
workspace = true
