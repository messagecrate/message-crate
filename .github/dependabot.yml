version: 2
updates:
  # Rust workspace (all crates in Cargo.toml members)
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly

  # Tauri desktop app — excluded from the workspace, has its own Cargo.lock
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly

  # Product web frontend
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly

  # The generator of the web app's server API types, kept out of /web
  # because it declares a peer dependency on TypeScript 5
  - package-ecosystem: npm
    directory: /scripts/openapi-typescript
    schedule:
      interval: weekly

  # Documentation site
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    ignore:
      # @scalar/api-reference is held at 1.68.x. 1.69.0 and 1.69.1 pull in
      # versions of devalue, undici and @ai-sdk/provider-utils that fail
      # `npm audit --audit-level=high` in audit.yml (devalue,
      # GHSA-9rgm-9g3h-6x36, is the high one), while main passes it. #604
      # failed that audit twice, before and after a rebase. Scalar releases
      # most weeks, so ignoring one version would only bring the same pull
      # request back the next Monday.
      #
      # Remove this entry when a Scalar release passes the audit: in docs/,
      # `npm install @scalar/api-reference@latest && npm audit --audit-level=high`.
      - dependency-name: "@scalar/api-reference"

  # web-next/ is intentionally excluded: legacy Next.js browse UI, not in CI
  # and not served. Re-add it here if that tree is ever revived.

  # Base images of the release image (docker/Dockerfile). Each FROM is
  # pinned by tag and digest, so this entry is what moves the digests
  # when a publisher pushes a new image under the same tag (#2179).
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    ignore:
      # The Rust minor follows rust-toolchain.toml, which is bumped by hand
      # in its own pull request; scripts/check-docker-context.sh fails a
      # base image on another minor.
      - dependency-name: rust
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # A new Node.js major is a decision about the image, not a refresh of
      # it, so only the digest under the current tag moves here.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  # CI workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
