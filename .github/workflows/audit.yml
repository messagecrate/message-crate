name: Audit

# Dependency advisories fail when somebody publishes an advisory, not when
# somebody writes bad code, so they do not run on every pull request. They
# run when a change could alter the dependency graph (a manifest, a lockfile
# or the deny config moves — which is every Dependabot PR), when the audit
# itself changes (this file, scripts/audit-docs.sh, or the Node.js major in
# .nvmrc it installs), and on a weekly schedule that catches newly published
# advisories on main. These checks are deliberately not in the ruleset's
# required list. Why: docs/adr/0007-ci-is-the-only-gate.md.
#
# The same trigger runs the licence policy
# (docs/adr/0014-gpl-code-only-behind-a-process-boundary.md): every
# crate in the workspace and in the desktop app must carry a permissive
# licence, and the two GPL readers of Apple Messages may appear only under
# the imessage-reader helper program. A new dependency is a lockfile change,
# so a GPL crate added to a Fair Core License crate fails here.

on:
  pull_request:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "deny.toml"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "web/package-lock.json"
      - "web/package.json"
      - "docs/package-lock.json"
      - "docs/package.json"
      - "scripts/openapi-typescript/package-lock.json"
      - "scripts/openapi-typescript/package.json"
      - "scripts/website-check/package-lock.json"
      - "scripts/website-check/package.json"
      - ".nvmrc"
      - ".github/workflows/audit.yml"
      - "scripts/audit-docs.sh"
  schedule:
    # Mondays 09:13 UTC. An off-hour minute avoids the on-the-hour spike.
    - cron: "13 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    name: cargo-deny (advisories, licences, bans)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Workspace
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans

      # src-tauri is its own workspace, so its graph is checked on its own.
      # This is the graph the installers ship, and the one that must hold no
      # GPL code.
      - name: Desktop app
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml
          arguments: --config deny.toml
          command: check licenses bans

  npm-audit:
    name: Audit npm deps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The Node.js that builds web/ and docs/ elsewhere. Each npm ci below
      # runs its tree's install scripts and engine checks, so on any other
      # Node.js the audit could fail, or pass, for a reason the builds do
      # not share.
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            docs/package-lock.json
            scripts/openapi-typescript/package-lock.json
            scripts/website-check/package-lock.json

      - name: Audit web frontend
        run: |
          cd web
          npm ci
          npm audit --audit-level=high

      # The generator of the web app's server API types runs in CI and on
      # developers' machines, from its own tree beside web/.
      - name: Audit API type generator
        run: |
          cd scripts/openapi-typescript
          npm ci
          npm audit --audit-level=high

      # The browser check of the served website, which nightly.yml runs
      # from its own tree beside web/.
      - name: Audit website check
        run: |
          cd scripts/website-check
          npm ci
          npm audit --audit-level=high

      # The script holds the list of advisories accepted with no patched
      # version, each with its reason, and fails on any other high or
      # critical one.
      - name: Audit docs site
        run: |
          (cd docs && npm ci)
          ./scripts/audit-docs.sh
